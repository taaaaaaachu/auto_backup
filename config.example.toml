[source]
paths = [
  "C:/Users/name/Documents",
  "C:/dev/project"
]

[destination]
path = "D:/backups"

[archive]
# Omit this to keep each backup as a single file without splitting.
max_part_size_mb = 500
compression_level = 6

[exclude]
patterns = [
  "target/**",
  "node_modules/**",
  ".git/**",
  "*.tmp"
]
# Absolute paths excluded with everything under them. Each must be inside one of source.paths.
paths = [
  "C:/dev/project/data/cache"
]

[behavior]
verify_after_copy = true
delete_local_archive_after_copy = true
skip_unreadable_files = false
# Check GitHub Releases for a newer version on each backup and log a notice.
check_for_updates = true

[work]
# Omit this to use the OS temp directory.
path = "C:/tmp/auto_backup"

[log]
# Omit this to write auto_backup.log next to the executable's working directory.
path = "C:/tmp/auto_backup/auto_backup.log"
