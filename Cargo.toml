[package]
name = "auto_backup"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
walkdir = "2.5"
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
wio = "0.2"

[target.'cfg(windows)'.dependencies.winapi]
version = "0.3"
features = [
  "vsbackup",
  "objbase",
  "winerror",
  "winbase",
  "consoleapi",
  "processenv",
  "wincon",
  "handleapi",
]
