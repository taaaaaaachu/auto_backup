name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo install zipsign --locked --version 0.2.2
      # self_update は名前に target を含む zip を探し、zipsign の署名を検証する
      - name: Package and sign
        env:
          ZIPSIGN_PRIVATE_KEY: ${{ secrets.ZIPSIGN_PRIVATE_KEY }}
        run: |
          $zip = "auto_backup-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path target/release/auto_backup.exe -DestinationPath $zip
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/signing.key", [Convert]::FromBase64String($env:ZIPSIGN_PRIVATE_KEY))
          zipsign sign zip $zip "$env:RUNNER_TEMP/signing.key"
          zipsign verify zip $zip signing-public.key
      - run: gh release create "${{ github.ref_name }}" auto_backup-x86_64-pc-windows-msvc.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
